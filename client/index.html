<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>MenuLens — AI Menu Analyzer</title>

    <!-- PWA -->
    <meta name="theme-color" content="#22c55e" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- iOS PWA support -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="MenuLens" />
    <link rel="apple-touch-icon" href="/icon-192.png" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />

    <!-- SEO / Social -->
    <meta name="description" content="Scan any restaurant menu and get personalized dish recommendations based on your dietary goals, allergies, and nutritional needs." />
    <meta property="og:title" content="MenuLens — AI Menu Analyzer" />
    <meta property="og:description" content="Scan any restaurant menu → get AI-powered, personalized dish recommendations based on your health goals, diet, and allergies." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://menu-lens-ten.vercel.app" />
    <meta property="og:image" content="https://menu-lens-ten.vercel.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:site_name" content="MenuLens" />
    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="MenuLens — AI Menu Analyzer" />
    <meta name="twitter:description" content="Scan any restaurant menu → get personalized dish recommendations powered by AI." />
    <meta name="twitter:image" content="https://menu-lens-ten.vercel.app/og-image.png" />

    <!-- Inter font — preloaded for html2canvas card generation -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
